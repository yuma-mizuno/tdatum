name: SageMath tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.8
      options: --user root
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install package
        run: sage -pip install --no-deps --no-build-isolation .
      - name: Regression tests and doctests
        run: sage -python tools/check.py
      - name: Verify wheel installation
        run: sage -python tools/check_install.py
      - name: Execute example notebooks
        run: sage -python tools/build_examples.py
      - name: Save validation results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tdatum-validation
          path: |
            test-results/
            docs/_build/examples/
          retention-days: 14
