[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemath-tdatum"
version = "0.1.0.dev0"
description = "T-data and mutation loops for SageMath"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Yuma Mizuno"}]
keywords = ["SageMath", "cluster algebras", "T-data", "Y-systems"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# SageMath is a prerequisite supplied by the user's Sage environment.
# Installing this distribution does not install SageMath.
[tool.setuptools.packages.find]
where = ["src"]
